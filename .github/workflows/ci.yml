name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore coub-downloader.sln

      - name: Build
        run: dotnet build coub-downloader.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test coub-downloader.sln --no-build --configuration Release --verbosity normal
